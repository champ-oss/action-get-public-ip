name: 'get-public-ip'
description: Discovers and outputs the public IP
inputs:
  retries:
    description: 'Maximum number of retries'
    required: false
    default: '60'
  service:
    description: 'URL of a service that responds with the caller''s IPv4 address as plain text'
    required: false
    default: 'https://api.ipify.org/'
outputs:
  ipv4:
    description: "IPv4"
    value: ${{ steps.ipv4.outputs.ipv4 }}

runs:
  using: "composite"
  steps:
    - id: ipv4
      shell: bash
      # Inputs are passed through env rather than ${{ }} so they can't inject shell code
      env:
        INPUT_RETRIES: ${{ inputs.retries }}
        INPUT_SERVICE: ${{ inputs.service }}
      run: bash "$GITHUB_ACTION_PATH/get-public-ip.sh"
